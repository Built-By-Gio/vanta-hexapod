<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>VANTA Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Archivo:wght@800&display=swap">
<style>
  :root { --bg:#0e0f11; --line:#2a2c30; --ink:#e6e6e2; --dim:#8b8f94; --amber:#ffaa00; --red:#ff4d4d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Mono", ui-monospace, monospace; }
  body { max-width:520px; margin:0 auto; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); user-select:none; }

  header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:10px; }
  header small { color:var(--dim); font-size:11px; letter-spacing:.12em; }
  #mode { font-family:"Archivo", sans-serif; font-size:32px; line-height:1; color:var(--amber); margin-top:3px; }
  #mode.stop { color:var(--red); }
  #link { font-size:12px; color:var(--dim); text-align:right; line-height:1.6; }
  #link i { display:inline-block; width:8px; height:8px; background:var(--red); margin-right:6px; }
  #link.on i { background:#5fd35f; }

  .stats { display:grid; grid-template-columns:repeat(3, 1fr); font-size:12px; margin:10px 0; }
  .stats div { color:var(--dim); }
  .stats b { display:block; color:var(--ink); font-weight:600; font-size:15px; }

  #cam { position:relative; background:#000; aspect-ratio:4/3; border:1px solid var(--line); }
  #cam img { width:100%; height:100%; object-fit:cover; display:block; }
  #cam.none { aspect-ratio:auto; height:44px; }
  #cam span { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:12px; }
  #warn { color:var(--red); font-size:12px; min-height:18px; margin:6px 0 2px; }

  button { font:inherit; color:var(--ink); background:#16171a; border:1px solid var(--line); padding:0; touch-action:manipulation; }
  button:active { background:#222428; }
  #stop { width:100%; height:74px; background:var(--red); border:none; color:#1a0000; font-family:"Archivo", sans-serif; font-size:30px; letter-spacing:.06em; margin:4px 0 14px; }
  #stop:active { background:#d93636; }

  h2 { font-size:11px; font-weight:400; color:var(--dim); letter-spacing:.12em; margin:14px 0 6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .grid button { height:58px; text-align:left; padding:0 12px; font-size:15px; font-weight:600; }
  .grid button small { display:block; font-weight:400; font-size:11px; color:var(--dim); }
  .grid button.on { border-color:var(--amber); color:var(--amber); }

  .height { display:grid; grid-template-columns:64px 1fr 64px; gap:6px; }
  .height button { height:58px; font-size:26px; }
  .bar { border:1px solid var(--line); position:relative; display:grid; place-items:center; font-size:15px; font-weight:600; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:rgba(255,170,0,.18); border-right:2px solid var(--amber); }
  .bar b { position:relative; }

  #log { font-size:12px; line-height:1.7; color:var(--dim); margin-top:4px; }
  #log div:first-child { color:var(--ink); }
</style>
</head>
<body>
<header>
  <div><small>MODE</small><div id="mode">—</div></div>
  <div id="link"><i></i><span id="linktext">connecting</span><br><span id="gesture">no hand</span></div>
</header>

<div class="stats">
  <div>speed<b id="speed">0 mm/s</b></div>
  <div>turn<b id="turn">0°/s</b></div>
  <div>hand<b id="hand">—</b></div>
</div>

<div id="cam" class="none"><span>no camera</span></div>
<div id="warn"></div>

<button id="stop" data-m="STOP">STOP</button>

<h2>KEEPS GOING UNTIL STOP</h2>
<div class="grid">
  <button data-m="FOLLOW">FOLLOW<small>walk after your hand</small></button>
  <button data-m="FAST FOLLOW">FAST FOLLOW<small>same, quicker</small></button>
  <button data-m="FREE ROAM">FREE ROAM<small>wander on its own</small></button>
  <button data-m="DANCE">DANCE<small>looping routine</small></button>
</div>

<h2>ONE-SHOT</h2>
<div class="grid">
  <button data-m="STAND">STAND<small>stand and hold</small></button>
  <button data-m="CROUCH">CROUCH<small>drop low</small></button>
  <button data-m="TRANSPORT">TRANSPORT<small>fold legs to carry</small></button>
</div>

<h2>HEIGHT</h2>
<div class="height">
  <button data-m="LOWER">−</button>
  <div class="bar"><i id="hbar"></i><b id="height">50%</b></div>
  <button data-m="RAISE">+</button>
</div>

<h2>LOG</h2>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);

document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("pointerdown", e => {
  e.preventDefault();
  fetch("/cmd?m=" + encodeURIComponent(b.dataset.m)).catch(() => {});
  if (navigator.vibrate) navigator.vibrate(b.dataset.m === "STOP" ? 60 : 15);
}));

const cam = new Image();
cam.onload = () => { $("cam").className = ""; $("cam").replaceChildren(cam); };
cam.onerror = () => { $("cam").className = "none"; $("cam").innerHTML = "<span>no camera</span>"; };
cam.src = "/cam.mjpg";

function connect() {
  const es = new EventSource("/state");
  es.onopen = () => { $("link").className = "on"; $("linktext").textContent = "connected"; };
  es.onerror = () => {
    $("link").className = ""; $("linktext").textContent = "offline";
    es.close(); setTimeout(connect, 1500);
  };
  es.onmessage = e => {
    const s = JSON.parse(e.data);
    if (!s.mode) return;
    $("mode").textContent = s.mode;
    $("mode").className = s.mode === "STOP" ? "stop" : "";
    $("speed").textContent = s.speed + " mm/s";
    $("turn").textContent = s.turn + "°/s";
    $("hand").textContent = s.hand ? "seen" : "—";
    $("gesture").textContent = s.gesture ? s.gesture.replace("_", " ") : (s.hand ? "no gesture" : "no hand");
    $("height").textContent = s.height + "%";
    $("hbar").style.width = s.height + "%";
    $("warn").textContent = s.warnings.length ? "joint limit: " + s.warnings.join(", ") : "";
    document.querySelectorAll(".grid button").forEach(b => b.classList.toggle("on", b.dataset.m === s.mode));
    $("log").innerHTML = s.log.slice().reverse().map(l => `<div>${l}</div>`).join("");
  };
}
connect();
</script>
</body>
</html>
