<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VANTA Sim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Archivo:wght@800&display=swap">
<style>
  :root { --ink:#e6e6e2; --dim:#8b8f94; --amber:#ffaa00; --red:#ff4d4d; --panel:rgba(14,15,17,.78); }
  html, body { margin:0; height:100%; background:#c3c7cc; overflow:hidden; font-family:"IBM Plex Mono", ui-monospace, monospace; color:var(--ink); }
  canvas { display:block; }
  .panel { position:absolute; background:var(--panel); padding:12px 14px; }
  #mode-box { top:14px; left:14px; min-width:230px; }
  #mode-box small { color:var(--dim); font-size:11px; letter-spacing:.12em; }
  #mode { font-family:"Archivo", sans-serif; font-weight:800; font-size:34px; line-height:1.05; color:var(--amber); margin:2px 0 8px; }
  #mode.stop { color:var(--red); }
  .row { display:flex; justify-content:space-between; gap:18px; font-size:13px; line-height:1.7; }
  .row span:first-child { color:var(--dim); }
  #hold { height:3px; background:var(--amber); width:0; margin-top:6px; }
  #cam-box { top:14px; right:14px; padding:6px; }
  #cam-box img { display:block; width:360px; max-width:34vw; }
  #cam-box .off { width:360px; max-width:34vw; padding:40px 0; text-align:center; color:var(--dim); font-size:12px; }
  #keys { left:14px; bottom:14px; font-size:12px; line-height:1.65; }
  #keys b { color:var(--amber); font-weight:600; display:inline-block; min-width:22px; }
  #keys .t { color:var(--dim); margin-bottom:4px; letter-spacing:.1em; font-size:11px; }
  #log { right:14px; bottom:14px; font-size:12px; line-height:1.6; min-width:280px; }
  #warn { color:var(--red); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<div id="mode-box" class="panel">
  <small>MODE</small>
  <div id="mode">—</div>
  <div class="row"><span>gesture</span><span id="gesture">—</span></div>
  <div id="hold"></div>
  <div class="row"><span>height</span><span id="height">—</span></div>
  <div class="row"><span>speed</span><span id="speed">—</span></div>
  <div class="row"><span>hand</span><span id="hand">—</span></div>
  <div id="warn"></div>
</div>
<div id="cam-box" class="panel"><img id="cam" alt=""></div>
<div id="keys" class="panel">
  <div class="t">KEYBOARD (no hand needed)</div>
  <div><b>1</b>STOP  <b>2</b>CROUCH  <b>3</b>FOLLOW  <b>4</b>FAST FOLLOW</div>
  <div><b>5</b>FREE ROAM  <b>6</b>DANCE  <b>7</b>TRANSPORT  <b>8</b>STAND</div>
  <div><b>↑</b>RAISE  <b>↓</b>LOWER  <b>C</b>camera follow</div>
</div>
<div id="log" class="panel"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const COLORS = { foot: 0xc0392b, frame: 0x1b1b1b, servo: 0x2b2b2b, cap: 0x1b1b1b, batt: 0x8fa3b8, cam: 0x2e7d3a, pi: 0x2e7d3a, pca: 0x5b3aa0, buck: 0x2a5a8a };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc3c7cc);
scene.fog = new THREE.Fog(0xc3c7cc, 2500, 6000);
const camera = new THREE.PerspectiveCamera(38, 1, 5, 20000);
camera.up.set(0, 0, 1);
camera.position.set(-650, -700, 520);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 60);

scene.add(new THREE.HemisphereLight(0xffffff, 0x70757b, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(400, -300, 900);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -500, right: 500, top: 500, bottom: -500, near: 10, far: 2500 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(8000, 80, 0x6f757c, 0x858b91);
grid.rotation.x = Math.PI / 2;
grid.position.z = 0.5;
scene.add(grid);

const rad = d => d * Math.PI / 180;
let rig = null;
fetch("/rig.json").then(r => r.json()).then(j => {
  rig = j;
  for (const leg of Object.values(rig.legs)) for (const k in leg) leg[k].M = new THREE.Matrix4().fromArray(leg[k].m);
});
function legFrames(name, c, f, t) {
  const L = rig.legs[name], out = {};
  let M = new THREE.Matrix4();
  for (const [k, a] of [["coxa", rig.coxa_sign * c], ["femur", f], ["tibia", t + rig.tibia_offset]]) {
    const ax = new THREE.Vector3(...L[k].axis).normalize();
    M = M.clone().multiply(L[k].M).multiply(new THREE.Matrix4().makeRotationAxis(ax, rad(a)));
    out[k] = M;
  }
  return out;
}

const robot = new THREE.Group();
scene.add(robot);
const legs = {};
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.05 });

function mesh(geo, name) {
  const m = new THREE.Mesh(geo, mat(COLORS[name]));
  m.castShadow = m.receiveShadow = true;
  return m;
}

new GLTFLoader().load("/hexapod.glb", gltf => {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeVertexNormals();
    const [key, cls] = o.name.split("|");
    const m = mesh(o.geometry, cls);
    robot.add(m);
    if (key === "body") return;
    const [leg, body] = key.split("_");
    m.matrixAutoUpdate = false;
    (legs[leg] ??= {})[o.name] = { m, body };
  });
});

const $ = id => document.getElementById(id);
let state = null, follow = true;
new EventSource("/state").onmessage = e => { state = JSON.parse(e.data); };
$("cam").onerror = () => { $("cam-box").innerHTML = '<div class="off">no camera (keyboard mode)</div>'; };
$("cam").src = "/cam.mjpg";

const KEYS = { "1": "open_palm", "2": "fist", "3": "point", "4": "peace", "5": "three", "6": "rock", "7": "shaka", "8": "ok", ArrowUp: "thumbs_up", ArrowDown: "thumbs_down" };
addEventListener("keydown", e => {
  if (KEYS[e.key]) { fetch("/cmd?g=" + KEYS[e.key]); e.preventDefault(); }
  if (e.key === "c" || e.key === "C") follow = !follow;
});

function apply(s) {
  const p = s.pose;
  robot.position.set(p.x, p.y, p.z);
  robot.rotation.set(p.roll, p.pitch, p.yaw, "ZYX");
  for (const name in legs) {
    if (!rig || !s.joints[name]) continue;
    const F = legFrames(name, ...s.joints[name]);
    for (const k in legs[name]) legs[name][k].m.matrix.copy(F[legs[name][k].body]);
  }
  $("mode").textContent = s.mode;
  $("mode").className = s.mode === "STOP" ? "stop" : "";
  $("gesture").textContent = s.gesture ? s.gesture.replace("_", " ") : "—";
  $("hold").style.width = s.gesture && s.progress < 1 ? (s.progress * 100) + "%" : "0";
  $("height").textContent = s.height + "%";
  $("speed").textContent = `${s.speed} mm/s · ${s.turn}°/s`;
  $("hand").textContent = s.hand ? "tracking" : "none";
  $("warn").textContent = s.warnings.length ? "joint limit: " + s.warnings.join(", ") : "";
  $("log").innerHTML = s.log.length ? s.log.slice().reverse().map((l, i) => `<div style="color:${i ? "var(--dim)" : "var(--ink)"}">${l}</div>`).join("") : '<div style="color:var(--dim)">no commands yet</div>';
}

const lastTarget = new THREE.Vector3(0, 0, 60);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
renderer.setAnimationLoop(() => {
  if (state) {
    apply(state);
    if (follow) {
      const t = new THREE.Vector3(state.pose.x, state.pose.y, 60);
      const d = t.clone().sub(lastTarget).multiplyScalar(0.08);
      controls.target.add(d); camera.position.add(d); lastTarget.add(d);
    }
    sun.position.set(state.pose.x + 400, state.pose.y - 300, 900);
    sun.target.position.set(state.pose.x, state.pose.y, 0);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
